name: Build & Deploy

on:
  push:
    branches:
      - main
      - segunda-version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Junta dist/ + api-backend/ en una carpeta _deploy/
      # uploads/ solo lleva .htaccess y .gitignore para que:
      #   1. El directorio se preserve en Hostinger incluso con git reset --hard
      #   2. git clean -fd no borre las imágenes (están en el patrón de .gitignore)
      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          cp -r dist/. _deploy/
          cp -r api-backend _deploy/api-backend
          mkdir -p _deploy/uploads
          cp uploads/.htaccess _deploy/uploads/.htaccess
          cp uploads/.gitignore _deploy/uploads/.gitignore
          mkdir -p _deploy/uploads/_trash
          cp uploads/_trash/.htaccess _deploy/uploads/_trash/.htaccess
          cp uploads/_trash/.gitignore _deploy/uploads/_trash/.gitignore

      # Publica _deploy/ como rama "deploy" (Hostinger jalará esta rama).
      # force_orphan: false (por defecto) para que Hostinger pueda hacer
      # git pull normal; con force_orphan:true haría checkout fresco y
      # borraría los archivos subidos en uploads/.
      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: deploy
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
