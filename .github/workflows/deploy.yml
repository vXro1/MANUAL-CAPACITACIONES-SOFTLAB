name: Build & Deploy

on:
  push:
    branches:
      - main
      - segunda-version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Junta dist/ + api-backend/ en una carpeta _deploy/
      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          cp -r dist/. _deploy/
          cp -r api-backend _deploy/api-backend

      # Publica _deploy/ como rama "deploy" (Hostinger jalará esta rama)
      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: deploy
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
